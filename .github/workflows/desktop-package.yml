name: Package desktop for Mac

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested app to GitHub Releases
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Serialize the complete build/publication transaction for this sole Mac channel.
  group: personal-macos-arm64
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'kiwabb/cindy' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Installed apps fetch engines on demand. Packaging stages its own pinned ripgrep.
      XDT_SKIP_AGENT_BIN_INSTALL: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Migration freezing checks need their historical baseline commit.
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check native Apple Silicon runner
        run: node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") process.exit(1)'

      - name: Assign update revision
        id: identity
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_ENV"
          import { personalRevisionForRun } from './apps/desktop/scripts/ci/personal-update-metadata.mjs';
          console.log(`CINDY_PERSONAL_UPDATE_REVISION=${personalRevisionForRun(process.env.GITHUB_RUN_ID, process.env.GITHUB_RUN_ATTEMPT)}`);
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package and smoke-test the app
        env:
          # Authenticate public release metadata requests on shared GitHub runner IPs.
          GITHUB_TOKEN: ${{ github.token }}
        # Keep the official 0.0.0 sentinel. The signed personal identity carries its own revision.
        # The existing packager applies ad-hoc signing and retains its packaged smoke test.
        run: pnpm release:package --platform darwin --arch arm64 --region global --no-sign

      - name: Create and verify installation DMG
        working-directory: apps/desktop/release/artifacts/global/unversioned/darwin-arm64
        run: |
          dmg_root="$RUNNER_TEMP/cindy-dmg"
          mkdir -p "$dmg_root"
          ditto -x -k cindy-unversioned-arm64.zip "$dmg_root"
          test -d "$dmg_root/Cindy.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create -volname Cindy -srcfolder "$dmg_root" -format UDZO cindy-unversioned-arm64.dmg
          hdiutil verify cindy-unversioned-arm64.dmg
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/prepare-personal-update.mjs" "$PWD" "$dmg_root/Cindy.app"

      - name: Check distributable and write checksums
        working-directory: apps/desktop/release/artifacts/global/unversioned/darwin-arm64
        run: |
          test -s cindy-unversioned-arm64.zip
          test -s cindy-unversioned-arm64.dmg
          test -s build-info.json
          test -s personal-update.json
          shasum -a 256 -c SHA256SUMS

      - name: Upload downloadable app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cindy-macos-arm64
          path: apps/desktop/release/artifacts/global/unversioned/darwin-arm64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: package
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cindy-macos-arm64
          path: dist

      - name: Checkout verified publication scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Publish immutable assets then advance the Mac channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          cd ..
          node source/apps/desktop/scripts/publish-personal-update.mjs dist
          printf '## Personal Mac update\n\nSource `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
