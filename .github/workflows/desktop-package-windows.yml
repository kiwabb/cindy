name: Package desktop for Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested app to GitHub Releases
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Serialize the complete build/publication transaction for this sole Windows channel.
  group: personal-windows-x64
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'kiwabb/cindy' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # The packager stages pinned runtime assets; installed apps fetch engines on demand.
      XDT_SKIP_AGENT_BIN_INSTALL: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check native Windows x64 runner
        run: |
          node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
          cargo --version

      - name: Assign update revision
        shell: bash
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_ENV"
          import { personalRevisionForRun } from './apps/desktop/scripts/ci/personal-update-metadata.mjs';
          console.log(`CINDY_PERSONAL_UPDATE_REVISION=${personalRevisionForRun(process.env.GITHUB_RUN_ID, process.env.GITHUB_RUN_ATTEMPT)}`);
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package and smoke-test the app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Keep the community 0.0.0 version. The embedded personal identity carries its own revision.
        # Retain the packager's real packaged startup/database smoke test.
        run: pnpm release:package --platform win32 --arch x64 --region global --no-sign

      - name: Verify the update payload and write checksums
        shell: bash
        working-directory: apps/desktop/release/artifacts/global/unversioned/win32-x64
        run: |
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/prepare-personal-update.mjs" "$PWD"
          for file in cindy-unversioned-x64.zip cindy-unversioned-Setup.exe build-info.json personal-update.json SHA256SUMS; do
            test -s "$file"
          done
          sha256sum --check SHA256SUMS

      - name: Upload downloadable app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cindy-windows-x64
          path: apps/desktop/release/artifacts/global/unversioned/win32-x64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: package
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cindy-windows-x64
          path: dist

      - name: Checkout verified publication scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Publish immutable assets then advance the Windows channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          cd ..
          node source/apps/desktop/scripts/publish-personal-update.mjs dist
          printf '## Personal Windows update\n\nSource `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
